name: Publish package (one-off backfill)

# Uses an NPM_TOKEN secret (granular access token with bypass 2FA) because
# the package does not exist yet and OIDC trusted publishing cannot create it.
# Delete this workflow after the first successful publish and switch to the
# release.yml OIDC flow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        default: v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code@2.1.303 --allow-scripts=@anthropic-ai/claude-code
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
