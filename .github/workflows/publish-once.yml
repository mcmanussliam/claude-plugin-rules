name: Publish once (v1.0.0 backfill)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        default: v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm install --global @anthropic-ai/claude-code@2.1.303 --allow-scripts=@anthropic-ai/claude-code
      - run: npm publish --provenance --access public
